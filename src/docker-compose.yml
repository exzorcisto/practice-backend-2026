services:
  app:
    build: .
    container_name: survey-app
    volumes:
      - .:/var/www
    # Добавь порты здесь, чтобы заходить через браузер
    ports:
      - "8000:8000" 
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: survey_db
      DB_USERNAME: sail
      DB_PASSWORD: password
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: survey-db
    environment:
      MYSQL_DATABASE: survey_db
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"